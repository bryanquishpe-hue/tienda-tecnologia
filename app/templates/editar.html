<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="container navbar-content">
            <h1 class="logo">⚡ Tienda<span>Tech</span></h1>
            <nav>
                <a href="{{ url_for('main.index') }}">Volver a la tienda</a>
            </nav>
        </div>
    </header>

    <main class="container form-container">
        <h2 class="section-title">Editar Producto</h2>

        <form method="POST" class="formulario-producto">
            <label>Nombre del producto</label>
            <input type="text" name="nombre" value="{{ producto.nombre }}" required>

            <label>Precio ($)</label>
            <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" required>

            <label>Stock disponible</label>
            <input type="number" name="stock" value="{{ producto.stock }}" required>

            <button type="submit" class="btn-comprar">Actualizar producto</button>
        </form>
    </main>

</body>
</html>
