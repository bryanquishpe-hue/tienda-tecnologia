name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

# NOTA: este workflow asume que la rama main tiene branch protection
# exigiendo que "Flask Tests" pase antes de poder mergear un PR.

env:
  AZURE_WEBAPP_NAME: app-tienda-bryan # TODO: reemplazar con el nombre real del App Service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
